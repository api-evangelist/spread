aid: spread
name: SPREAD
description: 'SPREAD is a Berlin-based, AI-native engineering intelligence platform for complex product
  development and manufacturing. It connects fragmented product lifecycle data across PLM, CAD, ERP,
  requirements, and simulation systems into a unified engineering ontology, so teams building automotive,
  defense, and industrial products can find issues earlier and ship faster. The platform surfaces a set
  of engineering intelligence solutions — Requirements Manager, Product Explorer, Error Inspector, and
  Action Tower — on top of SPREAD Studio, a low-code environment for building custom analyses, with 40+
  connectors to systems such as Teamcenter, Windchill, 3DEXPERIENCE, SAP, Polarion, JIRA, CATIA, and Creo.
  Customers include Volkswagen, Mercedes-Benz, BMW, Ford, Bosch, Audi, and Daimler Truck. Backed by HV
  Capital; added to the API Evangelist network and enriched from public sources.'
